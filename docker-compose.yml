version: '3'
networks:
  todo-net:
    driver: bridge
services:
  pythonapp:
    image: app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    networks:
      - todo-net
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql:1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    ports:
      - '3306:3306'
    networks:
      - todo-net
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data:
